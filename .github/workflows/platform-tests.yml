name: Platform tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "biocore/**"
      - "assets/brand/**"
      - "database/**"
      - "platform_pages/**"
      - "tests/**"
      - "biocore_app.py"
      - "requirements-dev.txt"
      - ".github/workflows/platform-tests.yml"
  push:
    branches:
      - main
    paths:
      - "biocore/**"
      - "assets/brand/**"
      - "database/**"
      - "platform_pages/**"
      - "tests/**"
      - "biocore_app.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9"

      - name: Compile platform modules
        run: python -m compileall -q biocore biocore_app.py platform_pages tests

      - name: Run unit tests
        run: python -m pytest -q
