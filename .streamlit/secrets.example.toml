# Copy these values to Streamlit secrets. Never commit the real secrets.
# This key is server-only. Never expose it to browser code or commit its value.
SUPABASE_URL = "https://example.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "replace-with-service-role-key"

# Rollout: shadow -> optional -> required. Keep shadow until every module
# exchanges central launch codes successfully.
BIOCORE_AUTH_MODE = "shadow"
BIOCORE_AUTH_API_URL = "https://auth.example-biocore.cl"
BIOCORE_AUTH_LOGIN_URL = "https://auth.example-biocore.cl/login"
BIOCORE_AUTH_ALLOWED_REDIRECT_HOSTS = "biocore-plataforma.streamlit.app,hongos.streamlit.app,darwin-check.streamlit.app,biocoreintelligence.streamlit.app"
BIOCORE_OIDC_PROVIDER = "supabase"
BIOCORE_OIDC_ISSUER = "https://example.supabase.co/auth/v1"
BIOCORE_OIDC_AUDIENCE = "authenticated"
BIOCORE_OIDC_JWKS_URL = "https://example.supabase.co/auth/v1/.well-known/jwks.json"

# Disabled migration-only emergency route. Remove after Phase D.
[legacy_admin]
enabled = false
password_salt = "replace-with-a-random-salt"
password_hash = "replace-with-pbkdf2-sha256-hash"
iterations = 600000

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "replace-with-your-oidc-client-id"
client_secret = "replace-with-your-oidc-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[connections.supabase]
url = "https://example.supabase.co"
key = "replace-with-anon-key"

# Cuenta gratuita de Copernicus Data Space. Crea un OAuth client en el
# Sentinel Hub Dashboard. Estas credenciales son solo del servidor.
[copernicus]
client_id = "replace-with-cdse-oauth-client-id"
client_secret = "replace-with-cdse-oauth-client-secret"

# URLs públicas de despliegue. No agregues claves ni tokens a estas direcciones.
[integrations]
field_url = "https://hongos.streamlit.app/"
darwincheck_url = "https://darwin-check.streamlit.app/"
intelligence_url = "https://biocoreintelligence.streamlit.app/"
geot_radar_url = "https://nibaldox.github.io/GeotRadarSim/"
