[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biocore-platform-client"
version = "0.1.0"
description = "Server-side client for BioCore central authentication"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["biocore_client*"]
